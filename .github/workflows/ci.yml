name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXSS_STORAGE_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/nexss_storage?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexss_storage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexss_storage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fast binary install (~2s), isolates linter dependencies from go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          task tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'task tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Tools
        run: task tools

      - name: Build
        run: task build

      - name: Lint Flow examples
        run: task examples

      - name: Run CI gate
        run: task ci

      - name: Benchmark smoke check
        run: task bench
